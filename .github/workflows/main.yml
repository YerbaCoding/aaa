name: Untitled
on: push
jobs: 
  bar:
    runs-on: windows-latest
    steps: 
      - uses: actions/chechkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
            tinytex: true
      - run: pip install ipykernel nbclient matplotlib PyMPDATA
      - run: quarto render Untitled1.ipynb --to pdf --execute
      - uses: actions/upload-artifact@v7
        with:
            path: Untitled1.pdf
